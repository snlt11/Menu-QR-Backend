services:
  mysql:
    image: mysql:8.4
    container_name: menu_qr_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: menu_qr_central
      MYSQL_USER: menu_qr_user
      MYSQL_PASSWORD: secret
    volumes:
      - menu_qr_mysql_data:/var/lib/mysql

  redis:
    image: redis:8.4-alpine
    container_name: menu_qr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - menu_qr_redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: menu_qr_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: menuqr
      MINIO_ROOT_PASSWORD: menuqrsecret
    volumes:
      - menu_qr_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  menu_qr_mysql_data:
  menu_qr_redis_data:
  menu_qr_minio_data:
